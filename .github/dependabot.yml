version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily

  # The article-audio worker has its own lockfile (npm, not yarn) because it ships as a
  # container image and the theme's dependency set must not grow an ONNX runtime.
  - package-ecosystem: npm
    directory: /deploy/tts-audio/worker
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Patch/minor bumps of the runtime stack: routine, and the image smoke test is the
      # real review.
      #
      # Majors are deliberately NOT grouped. A single grouped PR once carried
      # `@huggingface/transformers` 3 -> 4, whose tokenizer dropped the attribute the
      # worker read its vocabulary from; every phoneme was filtered out and synthesis
      # went silent. A major here must arrive alone, with its own title, its own image
      # smoke run, and a person deciding.
      tts-audio-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: docker
    directory: /deploy/tts-audio/worker
    schedule:
      interval: weekly
