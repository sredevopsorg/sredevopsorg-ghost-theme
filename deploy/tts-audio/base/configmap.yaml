# Non-secret configuration, shared by the receiver, the synthesis Jobs and the backfill.
#
# Every value here is meant to be changed with `kubectl edit`/`kustomize` while the
# pipeline is running, so nothing that matters to the theme is compiled into the image:
#
#   AUDIO_BASE_URL  the public host. Moving from audio.sredevops.org to another bucket,
#                   or losing Cloudflare's range support and switching to a gray-cloud
#                   CNAME, is one edit here — not a rebuild and a theme release.
#   TTS_VOICES      per-locale voice and speed, as JSON. A voice change is picked up by
#                   the next synthesis; the content hash includes the voice, so existing
#                   audio is regenerated on the post's next edit or backfill.
apiVersion: v1
kind: ConfigMap
metadata:
  name: tts-audio
  namespace: tts-audio
  labels:
    app.kubernetes.io/name: tts-audio
data:
  GHOST_API_URL: "https://www.sredevops.org"
  SITE_URL: "https://www.sredevops.org"
  GCS_BUCKET: "tts-sredevopsorg"
  AUDIO_BASE_URL: "https://audio.sredevops.org"

  # Kokoro-82M v1.0 voices. Same female timbre across locales, replacing Chirp 3: HD
  # Leda. `br` is the theme's content key for Brazilian Portuguese (not `pt`).
  TTS_VOICES: |
    {
      "en": { "voice": "af_heart", "speed": 1.0 },
      "es": { "voice": "ef_dora", "speed": 0.98 },
      "br": { "voice": "pf_dora", "speed": 0.98 }
    }

  # Sentences are packed up to this many characters per model call. Inference cost is
  # dominated by audio length, not call count, so larger chunks reduce overhead without
  # changing the work; 450 stays inside Kokoro's reliable range.
  TTS_CHUNK_CHARS: "450"
  # Silence inserted between chunks. Kokoro already pads sentences, so this is small.
  TTS_SENTENCE_GAP_MS: "240"

  # Model runtime. `q8` is the quantized weights the image bakes. Thread count barely
  # moved throughput when measured (4.5 -> 4.9 chars/s from 1 to 2 threads), so it is
  # left at onnxruntime's default rather than tuned.
  KOKORO_DTYPE: "q8"

---
# The Job manifest the receiver stamps for each post.
#
# Kept in a ConfigMap rather than generated by code so the shape is reviewable in the
# cluster and a resource tweak does not need an image build.
#
# Sizing, measured (README §Throughput and job sizing): synthesis runs at ~8 characters of
# article per second of CPU, plus ~10 s of model load per Job, so a 10k-character post is
# ~20 minutes at 2 CPUs. `activeDeadlineSeconds` is therefore one hour and the container
# asks for 4 CPUs, which roughly halves the synthesis time. `${POST_ID}`, `${IMAGE}` and
# `${POD_NAMESPACE}` are filled by src/k8s.mjs; nothing from a webhook payload is ever
# interpolated into a field name, only into this template's own values.
apiVersion: v1
kind: ConfigMap
metadata:
  name: tts-job-template
  namespace: tts-audio
  labels:
    app.kubernetes.io/name: tts-audio
data:
  job-template.json: |
    {
      "apiVersion": "batch/v1",
      "kind": "Job",
      "metadata": {
        "generateName": "tts-",
        "labels": {
          "app.kubernetes.io/name": "tts-audio",
          "app.kubernetes.io/component": "worker",
          "tts.sredevops.org/post": "${POST_ID}"
        }
      },
      "spec": {
        "ttlSecondsAfterFinished": 3600,
        "activeDeadlineSeconds": 3600,
        "backoffLimit": 2,
        "completions": 1,
        "parallelism": 1,
        "template": {
          "metadata": {
            "labels": {
              "app.kubernetes.io/name": "tts-audio",
              "app.kubernetes.io/component": "worker"
            }
          },
          "spec": {
            "serviceAccountName": "tts-worker",
            "automountServiceAccountToken": false,
            "restartPolicy": "Never",
            "enableServiceLinks": false,
            "securityContext": {
              "runAsNonRoot": true,
              "runAsUser": 1000,
              "runAsGroup": 1000,
              "fsGroup": 1000,
              "seccompProfile": { "type": "RuntimeDefault" }
            },
            "containers": [
              {
                "name": "worker",
                "image": "${IMAGE}",
                "imagePullPolicy": "IfNotPresent",
                "args": ["${POST_ID}"],
                "envFrom": [
                  { "configMapRef": { "name": "tts-audio" } },
                  { "secretRef": { "name": "tts-audio" } }
                ],
                "env": [
                  { "name": "POD_NAMESPACE", "value": "${POD_NAMESPACE}" },
                  { "name": "GOOGLE_APPLICATION_CREDENTIALS", "value": "/var/secrets/google/key.json" },
                  { "name": "TMPDIR", "value": "/tmp" }
                ],
                "resources": {
                  "requests": { "cpu": "2", "memory": "1500Mi" },
                  "limits": { "cpu": "4", "memory": "3Gi" }
                },
                "securityContext": {
                  "allowPrivilegeEscalation": false,
                  "readOnlyRootFilesystem": true,
                  "privileged": false,
                  "capabilities": { "drop": ["ALL"] }
                },
                "volumeMounts": [
                  { "name": "gcs-key", "mountPath": "/var/secrets/google", "readOnly": true },
                  { "name": "tmp", "mountPath": "/tmp" }
                ]
              }
            ],
            "volumes": [
              { "name": "gcs-key", "secret": { "secretName": "tts-audio", "items": [{ "key": "gcs-key.json", "path": "key.json" }] } },
              { "name": "tmp", "emptyDir": { "sizeLimit": "2Gi" } }
            ]
          }
        }
      }
    }
