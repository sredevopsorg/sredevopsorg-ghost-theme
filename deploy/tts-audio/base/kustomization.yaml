# Base for the article-audio pipeline: the parts that are the same in every cluster.
#
# Cluster-specific values (Gateway, hostname, image tag) are **not** here — they live in
# overlay/kustomization.yaml, so this base renders on its own (`kustomize build base`
# works and is what `make test` checks) and an overlay can pin them without touching the
# resources.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      app.kubernetes.io/part-of: tts-audio
      app.kubernetes.io/managed-by: kustomize

resources:
  - namespace.yaml
  - serviceaccounts.yaml
  - rbac.yaml
  - configmap.yaml
  - webhook.yaml
  - netpol.yaml

# `backfill.yaml` is deliberately NOT a resource.
#
# It is a one-shot Job, and `kubectl apply` is a create-or-update verb: as a resource it
# was (re)created by every `make deploy`, `make diff` and `make backfill`, so deploying an
# unrelated ConfigMap change silently started a full archive backfill. That is how a
# 221-Job flood happened in production — twice.
#
# A Job is also immutable once created, so applying an edited one fails outright rather
# than updating it; see the note in backfill.yaml.
#
# render.sh emits it as a separate document instead, and only `make backfill` applies it.

# Drop the namespace from generated names/selectors: every object declares its namespace
# explicitly, and adding `namespace: tts-audio` here would also rewrite the Namespace
# object itself (which kustomize then rejects).
