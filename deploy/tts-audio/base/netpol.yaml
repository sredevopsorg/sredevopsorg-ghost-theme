# Network policy: deny ingress by default, then allow exactly the gateway.
#
# ## Ingress only — egress is deliberately not restricted here
#
# There is no egress NetworkPolicy in this file. There used to be two
# (`egress-dns-and-https`, `allow-kubernetes-api-egress`), and on this cluster *any*
# egress policy selecting these pods silently broke every in-cluster destination.
#
# Measured on `noviembresre-1` (k3s, 2026-11-27), probing from inside the receiver pod:
#
#   no egress policy      -> 10.43.0.1:443 (API) OPEN, own ClusterIP OPEN
#   any egress policy     -> 10.43.0.1:443 ECONNREFUSED, own ClusterIP ECONNREFUSED
#
# "Any" is literal: a single policy whose only rule was `port: 443` with no `to:` was
# enough to refuse the API, as was an explicit `to: ipBlock 10.43.0.0/16` (the service
# range) and one widened to include `10.42.0.0/16` and the `100.64.0.0/10` node range.
# Deleting the policies restored connectivity with no other change. Pod-to-pod on the pod
# network kept working either way, and public hosts on 443 kept working, so the failure
# was specifically the service/ClusterIP path.
#
# That is a CNI/dataplane defect, not something this file can express around: there is no
# egress rule shape that both selects the pods and leaves the API server reachable. The
# practical consequence of keeping the policies was the worst of both worlds — the
# backfill could not create a single Job (221/221 `ECONNREFUSED`), while egress was not
# meaningfully contained anyway (any destination on 443 was permitted, so there was no real
# exfiltration boundary).
#
# So egress is left to the cluster default until the dataplane is fixed. If you re-add
# egress policies, verify with the probe above *before* trusting them: on this cluster a
# policy that reads correctly can still block the API. `test.sh` asserts that no egress
# policy is declared here, so re-adding one is a deliberate act.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: tts-audio
  labels:
    app.kubernetes.io/name: tts-audio
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-webhook-ingress
  namespace: tts-audio
  labels:
    app.kubernetes.io/name: tts-audio
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: tts-audio
      app.kubernetes.io/component: webhook
  policyTypes:
    - Ingress
  ingress:
    # Only the ingress controller / gateway. The namespace is a value to fill in:
    # `gke-gateway-infra`, `traefik`, `ingress-nginx` — whatever this cluster runs.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ${GATEWAY_NAMESPACE}
      ports:
        - protocol: TCP
          port: 8080
