# Placeholder for the Secret shape. **Do not put real values in this file.**
#
# The Secret is created from the operator's machine, never committed and never applied
# from CI (see deploy/tts-audio/README.md §"Create the Secret" and `make secret`):
#
#   make secret \
#     GHOST_ADMIN_API_KEY='<id>:<secret>' \
#     GHOST_TTS_WEBHOOK_SECRET='<the same secret you paste into the Ghost webhook>' \
#     GCS_SA_KEY=./tts-audio-runner-key.json
#
# Keys:
#   admin-api-key    Ghost Admin API key of the `tts-audio` integration (`id:secret`).
#                    Used by the receiver (clear marker on delete) and by the Jobs (read
#                    the post, write the marker). Needs Administrator, because code
#                    injection is admin-only.
#   webhook-secret   The HMAC secret Ghost signs deliveries with. Also in the Ghost
#                    integration's webhook settings.
#   gcs-key.json     The service-account key for the bucket, mounted read-only into
#                    synthesis Jobs only. Rotate by creating a new key, patching this
#                    Secret, restarting the webhook, then deleting the old key in GCP.
#
# Why a JSON key rather than Workload Identity: this cluster's Ghost runs outside the
# namespace and the project does not yet use WI for the publication; keeping the key in
# one Secret with a bucket-scoped role is the smaller surface today. The README records
# the migration (annotation + GSA binding) for when it is worth doing.
apiVersion: v1
kind: Secret
metadata:
  name: tts-audio
  namespace: tts-audio
  labels:
    app.kubernetes.io/name: tts-audio
type: Opaque
stringData:
  admin-api-key: "REPLACE_ME"
  webhook-secret: "REPLACE_ME"
  gcs-key.json: '{"type":"service_account","project_id":"REPLACE_ME"}'
