# Two identities, on purpose:
#
#   tts-webhook  — creates Jobs and tells Ghost what to do. No GCS, no model.
#   tts-worker   — synthesises and uploads. Never talks to the Kubernetes API.
#
# A single identity would mean the receiver holds the GCS key it never uses, and the
# worker holds the permission to create Jobs it never needs.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tts-webhook
  namespace: tts-audio
  labels:
    app.kubernetes.io/name: tts-audio
    app.kubernetes.io/component: webhook
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tts-worker
  namespace: tts-audio
  labels:
    app.kubernetes.io/name: tts-audio
    app.kubernetes.io/component: worker
# The worker never calls the API server, so it must not carry a token that could.
automountServiceAccountToken: false
