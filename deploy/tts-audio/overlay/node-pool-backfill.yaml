# The backfill Job's own placement. Same rationale as node-pool-webhook.yaml; kept separate
# because a kustomize strategic-merge patch document targets one kind.
apiVersion: batch/v1
kind: Job
metadata:
  name: tts-backfill
  namespace: tts-audio
spec:
  template:
    spec:
      nodeSelector:
        dsh.sredevops.org/node-pool: ${NODE_POOL}
