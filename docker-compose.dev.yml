---
# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/main/schema/compose-spec.json
services:

  ghost:
    image: ghcr.io/sredevopsorg/ghost-on-kubernetes:latest-docker
    restart: unless-stopped
    user: "65532" # nonroot user
    group_add:
      - "65532" # nonroot group
      # - "0"     # root group, required for jemalloc to work properly
      - "1000"  # additional group, required for jemalloc to work properly
    # privileged: true # Required for jemalloc to work properly
    ports:
      - "2368:2368"
    # This is required to import current config when migrating
    env_file:
      - .env
    environment:
      NODE_ENV: development
      LD_PRELOAD: /usr/lib/libjemalloc.so.2
      logging__transport: "stdout"
      logging__level: "debug"
      url: http://localhost:2368
      database__client: mysql
      process: local
      paths__contentPath: /var/lib/ghost/content
      server__port: 2368
      server__host: 0.0.0.0
      database__connection__host: db
      database__connection__user: ${DATABASE_USER:-ghost}
      database__connection__password: ${DATABASE_PASSWORD:?DATABASE_PASSWORD environment variable is required}
      database__connection__database: ghost
    volumes:
      - ${THEME_PATH}:/var/lib/ghost/content/themes/sredevopsorg-ghost-theme:rw
      - ${GHOST_DATA_PATH}/data/ghost:/var/lib/ghost/content:rw
    # depends_on:
    #   db:
    #     condition: service_healthy
    networks:
      - ghost_network

  db:
    image: docker.io/mysql:8.4
    restart: unless-stopped
    # user: "65532:65532" # nonroot user
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD:?DATABASE_ROOT_PASSWORD environment variable is required}
      MYSQL_USER: ${DATABASE_USER:-ghost}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD environment variable is required}
      MYSQL_DATABASE: ghost
      MYSQL_MULTIPLE_DATABASES: activitypub
    volumes:
      - ${GHOST_DATA_PATH}/data/mysql:/var/lib/mysql
      - ${GHOST_DATA_PATH}/mysql-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: mysqladmin ping -p$$MYSQL_ROOT_PASSWORD -h 127.0.0.1
      interval: 1s
      start_period: 30s
      # start_interval: 10s
      retries: 120
    networks:
      - ghost_network
networks:
  ghost_network:
    driver: bridge

